[project]
name = "xpisode-i2rt"
version = "0.1.0"
description = "I2RT YAM arms as xpisode device peers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "i2rt>=1.1.2,<2",
  "numpy>=1.24",
  "xpisode-device[iox]>=0.1.0,<0.2",
  "xpisode-format>=0.1.0,<0.2",
]

[project.urls]
Repository = "https://github.com/ningma-dev/xpisode-i2rt"
Issues = "https://github.com/ningma-dev/xpisode-i2rt/issues"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pyright[nodejs]>=1.1.400", "pytest>=8.3", "ruff>=0.12"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "PT", "RUF", "BLE"]

[tool.ruff.lint.isort]
known-first-party = ["xpisode_i2rt"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs", "scripts", ".github", "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "LICENSE", "pyproject.toml", "uv.lock"]

[tool.uv.sources]
xpisode-device = { git = "https://github.com/ningma-dev/xpisode.git", rev = "a96b19a1afbfb0b5722dd3f12740ab3b25bdb775", subdirectory = "packages/xpisode-device" }
xpisode-format = { git = "https://github.com/ningma-dev/xpisode.git", rev = "a96b19a1afbfb0b5722dd3f12740ab3b25bdb775", subdirectory = "packages/xpisode-format" }
i2rt = { url = "https://github.com/ningma-dev/i2rt/archive/dc2f358fd9be0448b45e0aa5a94bbefaec22d116.tar.gz" }

[tool.uv]
build-constraint-dependencies = ["scikit-build-core<0.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/xpisode_i2rt"]
