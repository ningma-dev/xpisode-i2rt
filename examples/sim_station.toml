# The same station without hardware: the follower is i2rt's MuJoCo SimRobot, the leader
# xpisode's fake handle, which sways by itself; the follower follows it once connected.
#
#     uv run xpisode run stations/yam/sim_station.toml   (from your station project)

station = "yam_sim"
control_hz = 100
required_streams = ["/follower/state", "/leader/input"]

[[devices]]
name = "follower"
command = ["xpisode-device", "run", "--station", "{station}", "--name", "{name}",
           "--factory", "xpisode_i2rt:YamFollower", "--config", '{"sim": true, "park_seconds": 0.5}']

[[devices]]
name = "leader"
command = ["xpisode-device", "run", "--station", "{station}", "--name", "{name}",
           "--factory", "xpisode_device.fake:FakeLeader",
           "--config", '{"motion": "wave"}']

[groups.arm]
endpoints = ["follower/joint_position"]
holder = "teleop"

# The teleop client drives the leader to follow the arm while somebody else drives the arm.
[groups.leader]
endpoints = ["leader/joint_position"]
holder = "teleop"

# The leader's buttons: button 0 switches the arm between the teleop client
# and whoever had it before (a policy); button 1 starts and ends a recording.
[[inputs]]
stream = "leader/input"
field = "buttons"
index = 0
operation = "switch"
groups = ["arm"]

[[inputs]]
stream = "leader/input"
field = "buttons"
index = 1
operation = "record"

[[clients]]
name = "teleop"
command = ["python", "-m", "xpisode_env.teleop", "--station", "{station}", "--name", "{name}", "--config", "teleop.toml"]
