[package]
name = "xpisode-i2rt"
version = "0.1.0"
edition = "2021"
description = "A real-time joint controller for I2RT YAM arms over SocketCAN."
license = "MIT"

[[bin]]
name = "i2rt-rtcore"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
