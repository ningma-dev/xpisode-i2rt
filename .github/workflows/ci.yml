name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Lint and package (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      # Packaging and lint do not install the private xpisode SDKs.
      - run: uvx ruff==0.17.2 check .
      - run: uvx ruff==0.17.2 format --check .
      - run: uv build
      - run: |
          uv venv
          uv pip install --no-deps dist/*.whl
          uv run --no-sync python scripts/check_release.py
      - if: matrix.python == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: package
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Find an unpublished version tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            version="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
            tag="v$version"
          fi
          if ! git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "No version tag to release."
            exit 0
          fi
          git merge-base --is-ancestor "$tag^{commit}" HEAD
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build and validate the tagged source
        if: steps.version.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git checkout --detach "$RELEASE_TAG"
          uv build
          uv venv
          uv pip install --no-deps dist/*.whl
          GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RELEASE_TAG" uv run --no-sync python scripts/check_release.py
      - name: Publish release archives
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag \
            --title "$RELEASE_TAG" --notes-file CHANGELOG.md
